name: Build and Test ExchangeGift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish src/ExchangeGift.Web -c Release --no-restore -o "${{ github.workspace }}/publish"

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: ExchangeGift-publish
          path: publish/
          if-no-files-found: error
          retention-days: 7